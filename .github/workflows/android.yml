name: Build Bibaiboba APK

on:
  push:
    branches: [ "main", "arena/**" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'
          cache-dependency-path: |
            Bibaiboba/**/*.gradle*
            Bibaiboba/gradle/libs.versions.toml
            Bibaiboba/gradle/wrapper/gradle-wrapper.properties

      - name: Build Debug & Release APKs
        working-directory: Bibaiboba
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug :app:assembleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk ../Bibaiboba-v1.0.0-release.apk
          cp app/build/outputs/apk/debug/app-debug.apk ../Bibaiboba-v1.0.0-debug.apk
          ls -lh ../Bibaiboba-v1.0.0-*.apk

      - name: Upload Release APK (compact, ready to install)
        uses: actions/upload-artifact@v7
        with:
          name: Bibaiboba-v1.0.0-release.apk
          path: Bibaiboba-v1.0.0-release.apk
          archive: false
          if-no-files-found: error

      - name: Upload Debug APK
        uses: actions/upload-artifact@v7
        with:
          name: Bibaiboba-v1.0.0-debug.apk
          path: Bibaiboba-v1.0.0-debug.apk
          archive: false
          if-no-files-found: error
